# Intestazioni di sicurezza e cache per il vostro hosting.
# Da dare a chi gestisce il server. GitHub Pages NON permette di impostarle (per questo la pagina
# contiene già un meta CSP di base); sul vostro server vanno impostate come intestazioni HTTP vere.
# I file dell'app sono tutti statici: nessun PHP/database necessario.

# ---------- NGINX (dentro il blocco server { ... }) ----------
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
# add_header X-Content-Type-Options "nosniff" always;
# add_header Referrer-Policy "no-referrer" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# add_header Strict-Transport-Security "max-age=31536000" always;   # solo quando HTTPS funziona su tutto il dominio
#
# # Gli aggiornamenti del programma devono arrivare subito: niente cache lunga su HTML/JS/CSS/service worker
# location ~* \.(html|js|css|webmanifest)$ { add_header Cache-Control "no-cache"; }
# location = /sw.js                         { add_header Cache-Control "no-cache"; }
# location /assets/fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
# location /assets/icons/ { add_header Cache-Control "public, max-age=604800"; }
# location /assets/img/   { add_header Cache-Control "public, max-age=604800"; }
#
# # Tipi di file (di solito già presenti): .webmanifest -> application/manifest+json, .woff2 -> font/woff2

# ---------- APACHE (.htaccess, con mod_headers abilitato) ----------
#
# <IfModule mod_headers.c>
#   Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
#   Header always set X-Content-Type-Options "nosniff"
#   Header always set Referrer-Policy "no-referrer"
#   Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
#   Header always set Strict-Transport-Security "max-age=31536000"
#   <FilesMatch "\.(html|js|css|webmanifest)$">
#     Header set Cache-Control "no-cache"
#   </FilesMatch>
# </IfModule>
# AddType application/manifest+json .webmanifest
# AddType font/woff2 .woff2

# Dopo la messa online verificare le intestazioni con https://securityheaders.com e il certificato con https://www.ssllabs.com/ssltest/
